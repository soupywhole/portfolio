    <script id="start-at-top">
      // Reset a fresh portfolio document before the browser restores an old section.
      if (!location.hash.startsWith('#/demo/') && performance.getEntriesByType('navigation')[0]?.type !== 'back_forward') {
        history.scrollRestoration = 'manual'
        history.replaceState(history.state, '', location.pathname + location.search)
        const startup = new AbortController()
        const finish = () => {
          startup.abort()
          history.scrollRestoration = 'auto'
        }
        const reset = () => {
          window.scrollTo({ top: 0, left: 0, behavior: 'instant' })
          requestAnimationFrame(() => {
            document.fonts.ready.then(() => requestAnimationFrame(() => {
              if (startup.signal.aborted) return
              window.scrollTo({ top: 0, left: 0, behavior: 'instant' })
              finish()
            }))
          })
        }
        for (const type of ['pointerdown', 'wheel', 'keydown', 'hashchange']) {
          window.addEventListener(type, finish, { once: true, passive: true, signal: startup.signal })
        }
        window.addEventListener('pageshow', reset, { once: true, signal: startup.signal })
      }
    </script>
